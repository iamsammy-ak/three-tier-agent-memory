[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tiered-memory"
version = "0.1.0"
description = "Three-tier long-term memory for LLM agents: working scratchpad, compressed episodes and versioned semantic facts with importance scoring, TTL eviction and SQLite persistence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["llm", "agents", "memory", "retrieval", "sqlite", "embeddings"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
models = ["fastembed>=0.4"]
llm = ["openai>=1.30"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
bench = ["matplotlib>=3.7"]
tokens = ["tiktoken>=0.7"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "matplotlib>=3.7",
    "openai>=1.30",
]

[project.scripts]
tiered-memory = "tiered_memory.cli:main"

[project.urls]
Homepage = "https://github.com/iamsammy-ak/three-tier-agent-memory"

[tool.hatch.build.targets.wheel]
packages = ["src/tiered_memory"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["models: needs the real embedding model (skipped when it is not available locally)"]

[tool.mypy]
python_version = "3.10"
files = ["src/tiered_memory"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
